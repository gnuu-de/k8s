apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: ghcr.io/gnuu-de/nginx:3.0.0
        imagePullPolicy: Always
        env:
        - name: COSIGNPUBKEY
          value: |
              -----BEGIN PUBLIC KEY-----
              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwT2gClqDPu3VvFfrE56EkW68NXj9
              Ct5SsvcPZC3yL5+6fa/Ox7isJdsvxf9rRmGKp8slnyN2/aWKIleY3Ut4Hw==
              -----END PUBLIC KEY-----
        name: nginx
        # Workaround: nginx:1.28 uses "pid /run/nginx.pid", which is not writable
        # for USER 101. Run nginx with a copy of the config that writes the pid
        # to /tmp. Remove once the image contains the Dockerfile.nginx fix.
        command:
        - /bin/sh
        - -c
        args:
        - |
          sed 's#/run/nginx.pid#/tmp/nginx.pid#' /etc/nginx/nginx.conf > /tmp/nginx.conf
          exec /docker-entrypoint.sh nginx -c /tmp/nginx.conf -g 'daemon off;'
        ports:
          - containerPort: 8080
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx
      initContainers:
      - name: install
        image: ghcr.io/gnuu-de/busybox:3.0.0
        env:
        - name: COSIGNPUBKEY
          value: |
              -----BEGIN PUBLIC KEY-----
              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwT2gClqDPu3VvFfrE56EkW68NXj9
              Ct5SsvcPZC3yL5+6fa/Ox7isJdsvxf9rRmGKp8slnyN2/aWKIleY3Ut4Hw==
              -----END PUBLIC KEY-----
        command:
        - git
        - clone
        - "https://github.com/gnuu-de/www.git"
        - "/work-dir"
        volumeMounts:
        - name: workdir
          mountPath: "/work-dir"
      dnsPolicy: ClusterFirst
      volumes:
      - name: workdir
        emptyDir: {}
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
